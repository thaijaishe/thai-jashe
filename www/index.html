.navbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}

input[type=checkbox],input[type=radio]{width:24px!important;height:24px!important;min-width:24px;flex:none;margin:0 8px 0 0;accent-color:var(--brand);cursor:pointer;vertical-align:middle}

const $ = s => document.querySelector(s);
const h = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const rs = n => '₹' + Math.round(+n || 0).toLocaleString('en-IN');
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
const THEMES = [['light','લાઇટ',['#F2F4F8','#1E2A78','#F5B301','#FFFFFF']],['dark','ડાર્ક',['#0E1120','#26318A','#F5B301','#171B2E']],
  ['saffron','કેસરી',['#FFF6EC','#A33E09','#FFB020','#FFFFFF']],['green','હરિયાળી',['#EFF6F1','#0E5A37','#F5B301','#FFFFFF']],['ocean','દરિયાઈ',['#EDF5F7','#0A5262','#FFB703','#FFFFFF']],
  ['purple','જાંબલી રાત',['#130E22','#3D2C90','#F5B301','#1D1633']],['black','કાળી (AMOLED)',['#000000','#141414','#F5B301','#101010']]];
let THEME = (t => THEMES.some(x => x[0] === t) ? t : 'light')(LS.get('tj_theme', 'light'));
function applyTheme(){ try{ const r = document.documentElement; if(THEME === 'light') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', THEME);
  const m = document.querySelector('meta[name="theme-color"]'); if(m) m.setAttribute('content', THEMES.find(x => x[0] === THEME)[2][1]); }catch(e){} }
applyTheme();
let LANG = ['en', 'hi'].includes(LS.get('tj_lang', 'gu')) ? LS.get('tj_lang', 'gu') : 'gu';
const LOC = () => LANG === 'en' ? 'en-IN' : LANG === 'hi' ? 'hi-IN' : 'gu-IN';
try{ document.documentElement.lang = LANG; }catch(e){}
function ago(ts){ if(!ts) return ''; const s = Math.max(0, (Date.now() - ts) / 1000);
  if(s < 60) return 'હમણાં'; if(s < 3600) return Math.floor(s/60) + ' મિનિટ પહેલાં';
  if(s < 86400) return Math.floor(s/3600) + ' કલાક પહેલાં'; return Math.floor(s/86400) + ' દિવસ પહેલાં'; }
function fmtDT(v){ if(!v || v === 'now') return 'હમણાં જ'; try{ const d = new Date(v);
  return d.toLocaleDateString(LOC(), {day:'numeric', month:'short'}) + ', ' + d.toLocaleTimeString(LOC(), {hour:'2-digit', minute:'2-digit'}); }catch(e){ return v; } }
function toast(t){ const el = $('#toast'); el.textContent = tr(String(t)); el.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => el.hidden = true, 2600); }
function copyText(t){ try{ navigator.clipboard.writeText(t).then(() => toast('કૉપિ થયું: ' + t)).catch(() => toast(t)); }catch(e){ toast(t); } }
let AC = null;
function beep(){ try{ AC = AC || new (window.AudioContext || window.webkitAudioContext)();
  [0, .25].forEach(d => { const o = AC.createOscillator(), g = AC.createGain(); o.frequency.value = 880; o.connect(g); g.connect(AC.destination);
  g.gain.setValueAtTime(.18, AC.currentTime + d); g.gain.exponentialRampToValueAtTime(.001, AC.currentTime + d + .2); o.start(AC.currentTime + d); o.stop(AC.currentTime + d + .22); }); }catch(e){} }
document.addEventListener('click', () => { try{ AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if(AC.state === 'suspended') AC.resume(); }catch(e){} });
/* ફોનની રિંગ (60 સેકન્ડ): Android એપમાં ફોનનો પોતાનો રિંગટોન (native Ringtone plugin), વેબમાં "ટ્રિંગ-ટ્રિંગ" + વાઇબ્રેશન */
function ringOnce(){ try{ AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if(AC.state === 'suspended') AC.resume();
  [0, .5].forEach(d => [440, 480].forEach(f => { const o = AC.createOscillator(), g = AC.createGain(); o.type = 'sine'; o.frequency.value = f; o.connect(g); g.connect(AC.destination);
    const t = AC.currentTime + d; g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.32, t + .02); g.gain.setValueAtTime(.32, t + .38); g.gain.linearRampToValueAtTime(0, t + .42); o.start(t); o.stop(t + .44); })); }catch(e){} }

const nativeRing = () => window.Capacitor && Capacitor.Plugins && Capacitor.Plugins.Ringtone;
const Ring = {bid:null, iv:null, t:null,
  start(bid, ms = 60000){ if(this.bid === bid) return; this.stop(); this.bid = bid; const P = nativeRing();
    if(P) P.start({seconds:Math.round(ms / 1000)}).catch(() => this.web()); else this.web();
    this.t = setTimeout(() => this.stop(), ms); },
  web(){ this.webOn = true; clearInterval(this.iv); /* ફક્ત રિંગ — વાઇબ્રેશન નહીં */
    try{ const a = this.au = this.au || new Audio(RING_MP3); a.loop = true; a.volume = 1; a.currentTime = 0; const pr = a.play(); if(pr && pr.catch) pr.catch(() => { if(this.webOn){ ringOnce(); this.iv = setInterval(ringOnce, 2400); } }); }
    catch(e){ ringOnce(); this.iv = setInterval(ringOnce, 2400); } },
  /* રિંગ + વાઇબ્રેશન બંને પૂરેપૂરા બંધ (ફોનમાં મોડું પહોંચેલ start પછી પણ — એટલે થોડી વાર પછી ફરી એક વાર) */
  stop(){ const had = !!this.bid; this.bid = null; clearInterval(this.iv); clearTimeout(this.t); this.iv = this.t = null; this.halt();
    if(had){ clearTimeout(this.t2); this.t2 = setTimeout(() => { if(!this.bid) this.halt(); }, 700); } },
  halt(){ const P = nativeRing(); if(P) P.stop().catch(() => {}); if(this.au){ try{ this.au.pause(); }catch(e){} } if(this.webOn){ this.webOn = false; try{ navigator.vibrate && navigator.vibrate(0); }catch(e){} } }
};

// Kari-GO logo concepts — each returns an SVG string (viewBox 0 0 64 64)
const Y = '#F5B301', N = '#1E2A78', W = '#FFFFFF', O = '#FF6B1A';
const wrench = (cx, cy, rot, fill, cut, s = 1) => `<g transform="translate(${cx} ${cy}) rotate(${rot}) scale(${s})">
  <rect x="-2.2" y="-1" width="4.4" height="17" rx="2.2" fill="${fill}"/>
  <circle cx="0" cy="-5" r="6.2" fill="${fill}"/>
  <rect x="-2" y="-13" width="4" height="7.5" rx=".8" fill="${cut}"/></g>`;
const gear = (cx, cy, r, fill, teeth = 8, tw = 5, th = 5) => {
  let t = ''; for(let i = 0; i < teeth; i++) t += `<rect x="${cx - tw / 2}" y="${cy - r - th + 1.5}" width="${tw}" height="${th + 1}" rx="1.2" fill="${fill}" transform="rotate(${i * 360 / teeth} ${cx} ${cy})"/>`;
  return t + `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${fill}"/>`;
};
const speed = (x, ys, ws, fill) => ys.map((y, i) => `<rect x="${x - ws[i]}" y="${y}" width="${ws[i]}" height="3.4" rx="1.7" fill="${fill}"/>`).join('');

// Kari-GO — ઘર ⟶ રોડ (વચ્ચે પાનું) ⟶ પિન  (viewBox 0 0 64 64)
const Y3 = '#F5B301', N3 = '#1E2A78', W3 = '#FFFFFF', O3 = '#FF6B1A';
function wr3(cx, cy, fill, cut, s){ // wrench centred at (cx,cy), 45°
  const tx = cx + 1.77 * s, ty = cy - 1.77 * s;
  return `<g transform="translate(${tx} ${ty}) rotate(45) scale(${s})"><rect x="-2.2" y="-1" width="4.4" height="17" rx="2.2" fill="${fill}"/><circle cx="0" cy="-5" r="6.2" fill="${fill}"/><rect x="-2" y="-13" width="4" height="7.5" rx=".8" fill="${cut}"/></g>`;
}
function house3(cx, cy, w, fill, out){
  const r = w / 2, b = w * 0.36;
  const d = `M${cx - r} ${cy - w * 0.02} L${cx} ${cy - w * 0.5} L${cx + r} ${cy - w * 0.02} L${cx + b} ${cy - w * 0.02} L${cx + b} ${cy + w * 0.42} L${cx - b} ${cy + w * 0.42} L${cx - b} ${cy - w * 0.02} Z`;
  const door = `<rect x="${cx - w * 0.09}" y="${cy + w * 0.16}" width="${w * 0.18}" height="${w * 0.26}" rx="${w * 0.03}" fill="${out}"/>`;
  return (out ? `<path d="${d}" fill="${out}" stroke="${out}" stroke-width="6" stroke-linejoin="round"/>` : '') +
    `<path d="${d}" fill="${fill}" stroke="${fill}" stroke-width="2" stroke-linejoin="round"/>` + (out ? door : '');
}
function pin3(cx, cy, r, tip, fill, out, dot){
  const dx = r * 0.82, y = cy + r * 0.57;
  const d = `M${cx - dx} ${y} A${r} ${r} 0 1 1 ${cx + dx} ${y} L${cx} ${tip} Z`;
  return (out ? `<path d="${d}" fill="${out}" stroke="${out}" stroke-width="5" stroke-linejoin="round"/>` : '') +
    `<path d="${d}" fill="${fill}" stroke="${fill}" stroke-width="1.5" stroke-linejoin="round"/><circle cx="${cx}" cy="${cy}" r="${r * 0.42}" fill="${dot}"/>`;
}
function road3(d, w, col, dash, out){
  return (out ? `<path d="${d}" fill="none" stroke="${out}" stroke-width="${w + 4}" stroke-linecap="round" stroke-linejoin="round"/>` : '') +
    `<path d="${d}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>` +
    `<path d="${d}" fill="none" stroke="${dash}" stroke-width="1.4" stroke-dasharray="3 3" stroke-linecap="round"/>`;
}
function badge3(cx, cy, r, bg, ring, wc){
  return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${bg}" stroke="${ring}" stroke-width="2"/>${wr3(cx, cy, wc, bg, r / 14)}`;
}

const COLS = ['karigars','customers','bookings','payments','settings','tickets','alerts','audit','kyc'];

function loadScript(src){ return new Promise((ok, no) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = no; document.head.appendChild(s); }); }
/* ================= FIREBASE (લાઇવ): Authentication (SMS OTP / એડમિન ઈમેલ), "ફક્ત મારો ડેટા" queries, Storage, Functions ================= */
const FB_V = '10.12.2', FB_REGION = 'asia-south1';
async function loadFirebase(){
  /* મફત (Spark) પ્લાન: Storage/Functions વગર */
  /* સુરક્ષા: Firebase ની ફાઇલો પોતાની વેબસાઇટ (lib/) પરથી — બહારની CDN પર આધાર નહીં; ન મળે તો જ Google (gstatic) પરથી */
  const mods = ['app', 'auth', 'firestore']; if(window.TJ_APPCHECK_KEY) mods.push('app-check');
  /* ઝડપ: બધી ફાઇલો એકસાથે ડાઉનલોડ (ક્રમ સચવાય), એક પછી એક નહીં */
  const one = (src) => new Promise((ok, no) => { const sc = document.createElement('script'); sc.src = src; sc.async = false; sc.onload = ok; sc.onerror = no; document.head.appendChild(sc); });
  try{ await Promise.all(mods.map(m => one(`lib/firebase-${m}-compat.js`))); }
  catch(e){ for(const m of mods){ const f = `firebase-${m}-compat.js`; if(!(window.firebase && (m === 'app' || firebase[m === 'app-check' ? 'appCheck' : m]))) await loadScript(`https://www.gstatic.com/firebasejs/${FB_V}/${f}`); } }
}
/* ખાનગી ફીલ્ડ અલગ દસ્તાવેજમાં: ગ્રાહકને કારીગરનો મોબાઇલ/લોકેશન/આધાર/IP ક્યારેય ન દેખાય */
const PRIVATE_K = ['mobile', 'pin', 'loc', 'locHist', 'locErr', 'lastIp', 'lastDev', 'lastLogin', 'logins', 'aadhaar4', 'aadhaarMasked', 'policeNo', 'policeDate', 'adminNote',
  'earnings', 'commissionDue', 'commissionPaid', 'upi', 'consentAt', 'cancels', 'kycDocs'];
const CONTACT_B = ['custMobile', 'address', 'geo', 'kMobile', 'kUpi', 'kLoc', 'kLocPrev'];
const FB = {
  side:{}, q:{}, subs:[], dyn:{}, urls:{}, subLoaded:{},
  col(c){ return Store.fs.collection(c); },
  split(c, id, obj){
    const out = {main:{}, extra:[]};
    if(c === 'karigars'){ const pri = {};
      for(const k in obj) (PRIVATE_K.includes(k) ? pri : out.main)[k] = obj[k];
      if('policeNo' in obj && isAdmin()) out.main.policeV = !!obj.policeNo; // ફક્ત એડમિન "પોલીસ વેરિફાઇડ" કરી શકે
      if(Object.keys(pri).length) out.extra.push([`karigars/${id}/private/main`, pri]); return out; }
    if(c === 'bookings'){ const con = {}, otp = {};
      for(const k in obj){ if(CONTACT_B.includes(k)) con[k] = obj[k]; else if(k === 'otp') otp.otp = obj[k]; else out.main[k] = obj[k]; }
      const b = Store.get('bookings', id) || obj;
      if(Object.keys(con).length) out.extra.push([`bookings/${id}/contact/main`, {...con, custId:b.custId, ts:b.createdAt || Date.now()}]);
      if(Object.keys(otp).length) out.extra.push([`bookings/${id}/otp/main`, {...otp, custId:b.custId}]); return out; }
    out.main = obj; return out; },
  clean(o){ const r = {}; for(const k in o) if(o[k] !== undefined) r[k] = o[k]; return r; },
  write(c, id, obj, merge){ const {main, extra} = this.split(c, id, obj); const err = e => { console.error(e); toast('સેવ ન થયું: ' + (e.code === 'permission-denied' ? 'મંજૂરી નથી' : e.message)); };
    /* પહેલા મુખ્ય દસ્તાવેજ, પછી ખાનગી ભાગ — સુરક્ષા નિયમ ચકાસે છે કે ખાનગી ભાગ ફક્ત પોતાના બુકિંગમાં જ લખાય */
    const first = (Object.keys(main).length || !merge) ? Store.fs.collection(c).doc(id).set(this.clean(main), merge ? {merge:true} : {}).catch(err) : Promise.resolve();
    return first.then(() => Promise.all(extra.map(([p, d]) => Store.fs.doc(p).set(this.clean(d), {merge:true}).catch(err)))); },
  /* cache = બધા listener ના પરિણામ + ખાનગી ભાગ ભેગા */
  recompute(c){ const m = {}; for(const k in (this.q[c] || {})) Object.assign(m, this.q[c][k]);
    const sd = this.side[c] || {}; for(const id in m) if(sd[id]) m[id] = {...m[id], ...sd[id]};
    Store.cache[c] = m; if(c === 'bookings') this.syncDyn(); Store.changed(); },
  setQ(c, key, map){ (this.q[c] = this.q[c] || {})[key] = map; this.recompute(c); },
  setSide(c, id, data){ const sd = (this.side[c] = this.side[c] || {}); sd[id] = {...(sd[id] || {}), ...data}; if(Store.cache[c][id]) Store.cache[c][id] = {...Store.cache[c][id], ...data}; Store.changed(); },
  stop(){ this.subs.forEach(u => { try{ u(); }catch(e){} }); this.subs = []; for(const k in this.dyn){ try{ this.dyn[k](); }catch(e){} } this.dyn = {}; this.q = {}; this.side = {}; this.subLoaded = {}; COLS.forEach(c => Store.cache[c] = {}); },
  /* ભૂમિકા પ્રમાણે ફક્ત જરૂરી ડેટા સાંભળો */
  subscribe(){ this.stop(); const s = S.session, uid = s && s.id, waits = [];
    const L = (c, key, ref, single) => waits.push(new Promise(res => { let first = true; const done = () => { if(first){ first = false; res(); } };
      this.subs.push(ref.onSnapshot(snap => { const map = {};
        if(single){ if(snap.exists) map[snap.id] = {...snap.data(), id:snap.id}; } else snap.forEach(d => map[d.id] = {...d.data(), id:d.id});
        this.setQ(c, key, map); done(); }, e => { console.warn(key, e.code || e.message); done(); })); setTimeout(done, 8000); }));
    const SIDE = (c, ref, idOf) => waits.push(new Promise(res => { let first = true; const done = () => { if(first){ first = false; res(); } };
      this.subs.push(ref.onSnapshot(snap => { const one = d => { this.side[c] = this.side[c] || {}; this.side[c][idOf(d)] = d.data(); };
        if(snap.forEach) snap.forEach(one); else if(snap.exists) one(snap); this.recompute(c); done(); }, e => { console.warn(c, e.code || e.message); done(); })); setTimeout(done, 8000); }));
    L('settings', 'main', Store.fs.doc('settings/main'), true);
    if(!s) return Promise.all(waits);
    if(s.role === 'customer'){
      L('karigars', 'approved', this.col('karigars').where('status', '==', 'approved'));
      L('customers', 'me', Store.fs.doc('customers/' + uid), true);
      L('bookings', 'mine', this.col('bookings').where('custId', '==', uid));
      L('tickets', 'mine', this.col('tickets').where('userId', '==', uid));
    }
    if(s.role === 'karigar'){
      L('karigars', 'me', Store.fs.doc('karigars/' + uid), true);
      SIDE('karigars', Store.fs.doc(`karigars/${uid}/private/main`), () => uid);
      L('bookings', 'mine', this.col('bookings').where('karigarId', '==', uid));
      L('payments', 'mine', this.col('payments').where('karigarId', '==', uid));
      L('tickets', 'mine', this.col('tickets').where('userId', '==', uid));
      this.reqCat = null; this.watchReq();
    }
    if(s.role === 'admin'){
      const [a] = rangeOf(); const from = isFinite(a) ? a : 0;
      L('karigars', 'all', this.col('karigars'));
      SIDE('karigars', Store.fs.collectionGroup('private'), d => d.ref.parent.parent.id);
      L('customers', 'all', this.col('customers'));
      L('kyc', 'all', this.col('kyc'));
      L('bookings', 'range', this.col('bookings').where('createdAt', '>=', from));
      L('bookings', 'active', this.col('bookings').where('status', 'in', ['searching', 'requested', 'accepted', 'onway', 'arrived', 'working', 'billed']));
      SIDE('bookings', Store.fs.collectionGroup('contact').where('ts', '>=', from), d => d.ref.parent.parent.id);
      L('tickets', 'all', this.col('tickets'));
      L('alerts', 'all', this.col('alerts'));
      L('payments', 'all', this.col('payments'));
      L('audit', 'range', this.col('audit').where('ts', '>=', from));
    }
    return Promise.all(waits); },
  /* કારીગરના કામના પ્રકારની નવી વિનંતીઓ (status = searching) */
  watchReq(){ const k = me(); if(!k || !k.cat || k.cat === this.reqCat) return; this.reqCat = k.cat;
    if(this.dyn.__req) this.dyn.__req(); delete (this.q.bookings || {}).req;
    this.dyn.__req = this.col('bookings').where('status', '==', 'searching').where('cat', ...(isXCat(k.cat) ? ['in', [k.cat, 'other']] : ['==', k.cat]))
      .onSnapshot(snap => { const map = {}; snap.forEach(d => map[d.id] = {...d.data(), id:d.id}); this.setQ('bookings', 'req', map); }, e => console.warn('req', e.code)); },
  /* મારા બુકિંગના સંપર્ક/OTP દસ્તાવેજ (ફક્ત ગ્રાહક, નક્કી થયેલ કારીગર અને એડમિન વાંચી શકે) */
  syncDyn(){ const s = S.session; if(!s || s.role === 'admin') return; const want = new Set();
    Store.all('bookings').filter(b => s.role === 'customer' ? b.custId === s.id : b.karigarId === s.id).sort((a, b) => b.createdAt - a.createdAt).slice(0, 25).forEach(b => {
      want.add('c:' + b.id); if(s.role === 'customer' && ACTIVE.includes(b.status)) want.add('o:' + b.id); });
    for(const k in this.dyn) if(k !== '__req' && !want.has(k)){ this.dyn[k](); delete this.dyn[k]; }
    want.forEach(k => { if(this.dyn[k]) return; const id = k.slice(2), path = k[0] === 'c' ? `bookings/${id}/contact/main` : `bookings/${id}/otp/main`;
      this.listenDyn(k, path, id, 0); });
    if(s.role === 'karigar') this.watchReq(); },
  /* દસ્તાવેજ હજુ લખાયો ન હોય ત્યારે Firestore "મંજૂરી નથી" કહી listener બંધ કરે — એટલે થોડી વાર પછી ફરી જોડો (ગ્રાહકનો OTP ન દેખાવાની ભૂલ) */
  listenDyn(k, path, id, n){
    this.dyn[k] = Store.fs.doc(path).onSnapshot(d => { if(d.exists){ const x = d.data(); delete x.custId; delete x.ts; this.setSide('bookings', id, x); } },
      e => { if(this.dyn[k] && n < 8) setTimeout(() => { if(this.dyn[k]) this.listenDyn(k, path, id, n + 1); }, Math.min(15000, 1500 * (n + 1))); }); },
  /* એડમિન: લૉગિન અને લોકેશન લૉગ (અલગ subcollection, 1 વર્ષ) જરૂર પડે ત્યારે જ */
  async loadSubs(kind, id){ const key = kind + id; if(Date.now() - (this.subLoaded[key] || 0) < 20000) return; this.subLoaded[key] = Date.now();
    const [a] = rangeOf(); const from = isFinite(a) ? a : 0;

const commOn = () => !!Store.settings().commOn;

  return topbar('ગ્રાહક લૉગિન', {back:true}) + `<div class="wrap"><div class="card"><h2>લૉગિન / નવું ખાતું</h2><p class="small muted">તમારા Gmail ખાતાથી એક ટેપમાં — કોઈ પાસવર્ડ કે SMS નહીં. નવા હશો તો પછી નામ અને મોબાઇલ પૂછશે.</p>
    ${gBtn('customer')}
    ${otpOn() ? `<div class="ordiv"><span>અથવા મોબાઇલ OTP</span></div><label class="f">મોબાઇલ નંબર<input id="cl_mob" inputmode="numeric" maxlength="10" value="${h(S.otpMob || '')}"></label>${otpBox()}<button class="btn ink block" onclick="custLogin()">${S.otpMob ? 'OTP ચકાસો' : '📩 OTP મોકલો'}</button>` : ''}
    ${terms}</div></div>`; }
async function custLogin(){
  if(Store.mode === 'firebase'){ const v = id => $('#' + id) ? $('#' + id).value.trim() : '';
    if(S.pendingAuth && Store.auth.currentUser){ const mob = v('cl_mob').replace(/\D/g, '') || S.pendingAuth.mobile; if(!v('cl_name')) return toast('નામ લખો'); if(!/^[6-9]\d{9}$/.test(mob)) return toast('10 આંકડાનો સાચો મોબાઇલ નંબર લખો');
      if(!areaVal('cl_area')) return toast('વિસ્તાર લખો અથવા નકશા પરથી પસંદ કરો');
      return fbAfterLogin('customer', {name:v('cl_name'), mobile:mob, area:areaVal('cl_area'), areaGeo:areaGeoVal('cl_area'), address:v('cl_addr')}); }
    if(!S.otpMob) return sendOtp(v('cl_mob')); const u = await confirmOtp(); if(u) await fbAfterLogin('customer'); return; }
  const name = $('#cl_name').value.trim(), mob = $('#cl_mob').value.replace(/\D/g, ''), area = areaVal('cl_area'), areaGeo = areaGeoVal('cl_area'), address = $('#cl_addr').value.trim();
  if(mob.length !== 10) return toast('10 આંકડાનો મોબાઇલ નંબર લખો');

  let c = Store.all('customers').find(x => x.mobile === mob);
  if(!c){ if(!name) return toast('નામ લખો'); if(!area) return toast('વિસ્તાર લખો અથવા નકશા પરથી પસંદ કરો'); c = {id:uid('c_'), name, mobile:mob, area, areaGeo, address, createdAt:Date.now()}; Store.put('customers', c); }
  else if(c.blocked) return toast('આ ખાતું બંધ છે — મદદ માટે હેલ્પલાઇન પર સંપર્ક કરો');
  else if(address) Store.patch('customers', c.id, {address, area});
  setSession({role:'customer', id:c.id}); home(); logAccess('login');
}

function filterCats(q){ q = q.trim().toLowerCase(); document.querySelectorAll('#catgrid .cat').forEach(el => el.hidden = !!q && !el.dataset.n.toLowerCase().includes(q)); }
function kCard(k, area){

}

  Object.keys(MAPS).forEach(k => { if(!els.some(e => e.dataset.mk === k)){ try{ MAPS[k].map.remove(); }catch(e){} delete MAPS[k]; } });
  if(!els.length || LEAF_BAD) return;
  try{ await needLeaflet(); }catch(e){ return; }
  els.forEach(ph => { const key = ph.dataset.mk, spec = MAPSPEC[key]; if(!spec || !ph.isConnected || !spec.pts.length) return;
    let M = MAPS[key]; if(M && M.dead) return;
    if(!M){ const div = document.createElement('div'); div.className = 'lmap-in'; ph.replaceChildren(div);
      const map = L.map(div, {scrollWheelZoom:false, attributionControl:true, zoomControl:true}); map.attributionControl.setPrefix('');
      const tl = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'© OpenStreetMap'}); let ok = 0, bad = 0;
      M = MAPS[key] = {div, map, layer:L.layerGroup().addTo(map), fitted:false, dead:false};
      tl.on('tileload', () => ok++); tl.on('tileerror', () => { if(++bad >= 4 && !ok && !M.dead){ M.dead = true; try{ map.remove(); }catch(e){} const p2 = document.querySelector(`.lmap[data-mk="${key}"]`); if(p2) p2.innerHTML = miniMap(spec.pts, spec.o); } });
      tl.addTo(map); addSatToggle(map, tl); map.on('dragstart', () => { M.user = true; });
    } else if(M.div.parentNode !== ph) ph.replaceChildren(M.div);
    M.layer.clearLayers(); const o = spec.o;
    if(o.path && o.path.length > 1) L.polyline(o.path.map(p => [p.lat, p.lng]), {color:'#8FA0FF', weight:3, dashArray:'5 5'}).addTo(M.layer);
    if(o.route && o.route.length > 1) L.polyline(o.route, {color:'#1E2A78', weight:5, opacity:.85}).addTo(M.layer);
    else if(o.line && spec.pts.length > 1) L.polyline(spec.pts.slice(0, 2).map(p => [p.lat, p.lng]), {color:'#1E2A78', weight:3, dashArray:'6 6'}).addTo(M.layer);
    spec.pts.forEach(p => L.marker([p.lat, p.lng], {icon:lIcon(p), title:tr(p.label || ''), zIndexOffset:p.kind === 'bike' ? 1000 : 0}).addTo(M.layer));
    setTimeout(() => { try{ M.map.invalidateSize(); }catch(e){} }, 30);
    if(!M.fitted || (o.follow && !M.user)){ const pts = [...spec.pts.map(p => [p.lat, p.lng]), ...((o.route || []).length ? [o.route[0], o.route[o.route.length - 1]] : [])];
      if(pts.length === 1) M.map.setView(pts[0], 15); else M.map.fitBounds(pts, {padding:[36, 36], maxZoom:16}); M.fitted = true; }
  }); }
/* રસ્તો: OSRM (OpenStreetMap) — ન મળે તો સીધી લીટી */
const ROUTES = {};
function routeFor(id, from, to){ if(!from || !to) return null; const R0 = ROUTES[id], now = Date.now();
  if(R0 && (R0.busy || (now - R0.at < 90000 && geoKm(R0.from, from) < .3))) return R0.data;
  ROUTES[id] = {from, at:now, data:R0 && R0.data, busy:true};
  const ctl = window.AbortController ? new AbortController() : null; if(ctl) setTimeout(() => ctl.abort(), 7000);
  fetch(`https://router.project-osrm.org/route/v1/driving/${from.lng},${from.lat};${to.lng},${to.lat}?overview=full&geometries=geojson`, ctl ? {signal:ctl.signal} : {})
    .then(r => r.json()).then(j => { const rt = j && j.routes && j.routes[0]; if(!rt) throw 0;
      ROUTES[id] = {from, at:Date.now(), data:{coords:rt.geometry.coordinates.map(c => [c[1], c[0]]), km:rt.distance / 1000, min:Math.max(1, Math.round(rt.duration / 60 * 1.15))}};
      if(['c_track','k_job','a_booking'].includes(S.view)) render(); })
    .catch(() => { ROUTES[id] = {from, at:Date.now(), data:R0 && R0.data || null}; });
  return R0 && R0.data; }

/* simple offline SVG map (no external tiles) */
function miniMap(pts, o = {}){
  pts = pts.filter(p => p && isFinite(p.lat) && isFinite(p.lng));
  const city = Object.values(AREAS).map(a => ({lat:a[1], lng:a[2]}));
  let fitTo = o.fit && pts.length ? [...pts, ...(o.path || [])] : [...city, ...pts]; if(!fitTo.length) fitTo = [DEF_LL];
  let la0 = Math.min(...fitTo.map(p => p.lat)), la1 = Math.max(...fitTo.map(p => p.lat)), lo0 = Math.min(...fitTo.map(p => p.lng)), lo1 = Math.max(...fitTo.map(p => p.lng));
  const pad = Math.max(.004, (la1 - la0) * .12, (lo1 - lo0) * .12); la0 -= pad; la1 += pad; lo0 -= pad; lo1 += pad;
  const W = 340, H = 210, cs = Math.cos((la0 + la1) / 2 * Math.PI / 180);
  const sc = Math.min(W / ((lo1 - lo0) * cs), H / (la1 - la0)), ox = (W - (lo1 - lo0) * cs * sc) / 2, oy = (H - (la1 - la0) * sc) / 2;
  const X = g => ox + (g - lo0) * cs * sc, Y = g => H - oy - (g - la0) * sc;
  const areas = Object.values(AREAS).filter(a => a[1] > la0 && a[1] < la1 && a[2] > lo0 && a[2] < lo1)
    .map(a => `<circle cx="${X(a[2]).toFixed(1)}" cy="${Y(a[1]).toFixed(1)}" r="2.2" class="ma"/><text x="${(X(a[2]) + 4).toFixed(1)}" y="${(Y(a[1]) + 3).toFixed(1)}" class="mt">${h(a[0])}</text>`).join('');
  const path = o.path && o.path.length > 1 ? `<polyline points="${o.path.map(p => X(p.lng).toFixed(1) + ',' + Y(p.lat).toFixed(1)).join(' ')}" fill="none" stroke="#8FA0FF" stroke-width="2" stroke-dasharray="4 3"/>` : '';
  const dots = pts.map(p => `<g><title>${h(p.label || '')}</title>${p.kind === 'bike' ? `<image href="${RIDER[riderIdx(p.deg)]}" x="${(X(p.lng) - 19).toFixed(1)}" y="${(Y(p.lat) - 34).toFixed(1)}" width="38" height="38"/>` : p.kind === 'home' ? `<g transform="translate(${X(p.lng).toFixed(1)} ${Y(p.lat).toFixed(1)}) scale(.9) translate(-14 -30)">${HOME_SVG_IN}</g>` : `<circle cx="${X(p.lng).toFixed(1)}" cy="${Y(p.lat).toFixed(1)}" r="${p.r || 6}" fill="${p.c || '#1E2A78'}" stroke="#fff" stroke-width="2"/>`}${o.labels && p.label ? `<text x="${(X(p.lng) + 9).toFixed(1)}" y="${(Y(p.lat) + 4).toFixed(1)}" class="ml">${h(p.label)}</text>` : ''}</g>`).join('');
  return `<svg class="mmap" viewBox="0 0 ${W} ${H}" role="img" aria-label="નકશો"><rect width="${W}" height="${H}" class="mbg"/>${areas}${path}${dots}</svg>`;
}

<p>તમે સ્વતંત્ર સેવા-પ્રદાતા (ગિગ વર્કર) છો, કંપનીના કર્મચારી નથી. ક્યારે ઓનલાઇન થવું અને કયું કામ સ્વીકારવું તે તમારી મરજી છે.</p>
<h3>2. નોંધણી અને ચકાસણી (KYC)</h3>
<ul><li>સાચું નામ, Google ખાતું (કે SMS OTP) થી લૉગિન, મોબાઇલ, ફોટો, <b>આધાર નંબર અને આધાર કાર્ડનો ફોટો ફરજિયાત</b>.</li>
<li>આધાર નંબર ફક્ત સાચો છે તે ચકાસવા લેવાય છે; એપમાં ફક્ત "XXXX XXXX છેલ્લા 4" અને ગુપ્ત hash રખાય છે — પૂરો નંબર સંગ્રહાતો નથી (UIDAI માર્ગદર્શન).</li>
<li>આધાર કાર્ડ અને પોલીસ વેરિફિકેશન સર્ટિફિકેટના ફોટા સુરક્ષિત સર્વર (Google Firebase) પર રખાય છે અને <b>ફક્ત એડમિન</b> જોઈ શકે છે; ગ્રાહકને ક્યારેય દેખાતા નથી.</li>
<li>પોલીસ વેરિફિકેશન સર્ટિફિકેટ આપવું જરૂરી છે; ત્યાં સુધી પ્રોફાઇલ "મંજૂરી બાકી" રહી શકે છે. એડમિન ઓરિજિનલ જોઈને મંજૂરી આપે છે.</li></ul>
<h3>3. કમીશન અને હિસાબ</h3>
<ul>{{?comm}}<li>દરેક પૂરા થયેલા કામના કુલ બિલ પર {{comm}}% કમીશન. બાકી કમીશન {{due}} થાય તો ચૂકવ્યા પછી જ નવું કામ મળશે. દરેક કમીશનનું ઇન્વોઇસ એપમાંથી ડાઉનલોડ થઈ શકે છે.</li>{{/comm}}
{{^comm}}<li><b>હાલ કોઈ કમીશન નથી.</b> ગ્રાહક જે ચૂકવે તે પૂરી રકમ તમારી. ભવિષ્યમાં કમીશન શરૂ થાય તો ઓછામાં ઓછા 30 દિવસ પહેલાં એપમાં જાણ કરવામાં આવશે અને નવી શરતો સ્વીકાર્યા પછી જ લાગુ થશે.</li>{{/comm}}
{{?coupon}}<li>ગ્રાહકના કૂપનની છૂટ એપ ભોગવે છે અને તમને સરભર કરી અપાય છે.</li>{{/coupon}}
<li>તમારી આવક પર આવકવેરો/GST ની જવાબદારી તમારી છે, લાગુ પડે ત્યાં.</li></ul>
<h3>4. લોકેશન, IP અને ડિવાઇસ માહિતી</h3>
<p>તમે <b>ઓનલાઇન</b> હો ત્યારે નજીકનું કામ આપવા, ગ્રાહકને લાઇવ ટ્રેકિંગ બતાવવા અને સલામતી/છેતરપિંડી રોકવા માટે તમારું GPS લોકેશન સમયાંતરે લેવાય છે. લૉગિન વખતે IP સરનામું અને ડિવાઇસની વિગત નોંધાય છે. ઓફલાઇન થાઓ એટલે લોકેશન લેવાનું બંધ થાય છે. વિગત પ્રાઇવસી પોલિસીમાં.</p>
<h3>5. વર્તન</h3>
<ul><li>સમયસર પહોંચવું, OTP વગર કામ શરૂ ન કરવું, એપમાં બિલ બનાવવું.</li>
<li>એપમાં બતાવેલ બિલથી વધુ રકમ ન લેવી. ગ્રાહકનો નંબર કામ સિવાય ન વાપરવો.</li>
<li>નશો, ગેરવર્તન, ચોરી કે ગ્રાહકને એપ બહાર બોલાવવા પર ખાતું કાયમ બંધ થશે અને જરૂર પડે તો પોલીસને જાણ કરાશે.</li></ul>
<h3>6. રેટિંગ</h3>
<p>સરેરાશ રેટિંગ 3.5 થી નીચે જાય કે વારંવાર કામ રદ કરો તો ચેતવણી પછી ખાતું થોડા સમય માટે બંધ થઈ શકે છે.</p>
<h3>7. ખાતું બંધ કરવું</h3>
<p>તમે ગમે ત્યારે પ્રોફાઇલમાંથી ખાતું ડિલીટ કરી શકો છો.{{?comm}} બાકી કમીશન ચૂકવવાની જવાબદારી રહે છે.{{/comm}}</p>
<h3>8. સામાજિક સુરક્ષા</h3>
<p>સરકારના નિયમો (સામાજિક સુરક્ષા સંહિતા 2020) મુજબ ગિગ વર્કર તરીકે e-Shram/સરકારી પોર્ટલ પર નોંધણી કરવામાં કંપની મદદ કરશે.</p>
<h3>9. વિવાદ</h3><p>{{?comm}}કમીશન કે {{/comm}}ગ્રાહક સાથેના વિવાદ માટે એપમાં ફરિયાદ કરો. કાયદાકીય હકુમત: {{city}}.</p>`},

privacy:{icon:'🔒', title:'પ્રાઇવસી પોલિસી', body:`
<p>છેલ્લો સુધારો: {{date}}. સંચાલક (Data Fiduciary): {{biz}}, {{addr}}. આ નીતિ ડિજિટલ પર્સનલ ડેટા પ્રોટેક્શન કાયદો 2023 અને IT નિયમો 2011/2021 મુજબ છે.</p>
<h3>1. અમે કઈ માહિતી લઈએ છીએ</h3>
<ul><li><b>ગ્રાહક:</b> નામ, Google ખાતું (કે SMS OTP) થી લૉગિન, મોબાઇલ, વિસ્તાર, સરનામાં, બુકિંગ, તકલીફનું વર્ણન, રેટિંગ, એપમાંના સંદેશા. બુકિંગ વખતે GPS લોકેશન (તમે મંજૂરી આપો તો) — નજીકના ({{radius}} કિમીની અંદરના) કારીગર શોધવા અને સરનામું ચોક્કસ કરવા.</li>
<li><b>કારીગર:</b> નામ, મોબાઇલ, ફોટો, કામ, અનુભવ, વિસ્તાર, આધાર (ફક્ત છેલ્લા 4 આંકડા + ગુપ્ત hash), આધાર કાર્ડ અને પોલીસ સર્ટિફિકેટના ફોટા (ફક્ત એડમિન માટે), પોલીસ વેરિફિકેશન નંબર,{{?upi}} UPI ID,{{/upi}} કમાણી{{?comm}} અને કમીશન{{/comm}}નો હિસાબ.</li>
<li><b>સૂચનાઓ (Push):</b> નવી વિનંતી/બુકિંગની સૂચના માટે ફોનનો સૂચના ટોકન (Firebase Cloud Messaging). નવી વિનંતી વખતે કારીગરના ફોનમાં 1 મિનિટ રિંગ વાગે છે.</li>
<li><b>કારીગરનું લોકેશન:</b> ઓનલાઇન હોય ત્યારે GPS લોકેશન (દર 1 મિનિટે, અને ગ્રાહક તરફ જતી વખતે વધુ વાર) અને તેનો ઇતિહાસ.</li>
<li><b>ટેકનિકલ માહિતી (બધા માટે):</b> લૉગિન/એપ ખોલવાનો સમય, IP સરનામું (અમારા સર્વર પર નોંધાય છે), ડિવાઇસ/બ્રાઉઝરનો પ્રકાર, ડિવાઇસ ID (એપે બનાવેલો રેન્ડમ નંબર), નેટવર્કનો પ્રકાર.</li>
<li><b>ફરિયાદ અને SOS:</b> ટિકિટની વિગત, SOS વખતનું લોકેશન.</li>
<li>અમે ફોનના સંપર્કો, SMS કે ગેલેરી વાંચતા નથી.</li></ul>
<h3>2. શા માટે</h3>
<ul><li>નજીકનો કારીગર શોધવો, બુકિંગ પૂરું કરવું, લાઇવ ટ્રેકિંગ બતાવવું.</li>
<li>ગ્રાહક અને કારીગરની સલામતી, SOS, છેતરપિંડી અને એકથી વધુ ખોટાં ખાતાં રોકવા (IP/ડિવાઇસ).</li>
<li>{{?comm}}કમીશનનો હિસાબ, {{/comm}}બિલ, ફરિયાદનો નિકાલ, કાયદાકીય ફરજો (સરકારી/પોલીસ માગણી).</li></ul>
<h3>3. કોને દેખાય છે</h3>
<ul><li>બુકિંગ સ્વીકાર્યા પછી જ ગ્રાહક અને કારીગરને એકબીજાનો નંબર અને સરનામું દેખાય છે. રસ્તામાં હોય ત્યારે કારીગરનું લોકેશન ફક્ત તે ગ્રાહકને દેખાય છે.</li>
<li>IP, ડિવાઇસ, લૉગિન અને લોકેશન ઇતિહાસ તથા આધાર/પોલીસ દસ્તાવેજ ફક્ત અધિકૃત એડમિનને દેખાય છે. દરેક વ્યક્તિ ફક્ત પોતાનો ડેટા જોઈ શકે (સર્વર સુરક્ષા નિયમોથી).</li>
<li>માહિતી Google Firebase (Authentication, Cloud Firestore, Cloud Messaging) સર્વર પર સંગ્રહાય છે; સૂચના અને IP નોંધ માટે Cloudflare સર્વર વપરાય છે. નકશો OpenStreetMap નો છે. અમે માહિતી વેચતા નથી. કાયદેસર લેખિત માગણી પર જ સરકારી એજન્સીને આપીએ છીએ.</li></ul>
<h3>4. કેટલો સમય</h3>
<ul><li>પ્રોફાઇલ: ખાતું ચાલુ હોય ત્યાં સુધી.</li><li>લૉગિન/IP લૉગ: ઓછામાં ઓછા 1 વર્ષ (DPDP નિયમો 2025) અને 180 દિવસ (CERT-In).</li>
<li>લોકેશન અને લૉગિન ઇતિહાસ: 1 વર્ષ, પછી આપમેળે ભૂંસાઈ જાય છે. આધાર/પોલીસ ફોટા: ખાતું ચાલુ હોય ત્યાં સુધી, ખાતું ડિલીટ થયે 30 દિવસમાં ભૂંસાય.</li>
<li>બુકિંગ અને બિલ: કાયદા મુજબ (GST માટે 6–8 વર્ષ) નામ વગર.</li></ul>
<h3>5. તમારા અધિકાર</h3>
<ul><li>પોતાની માહિતી જોવી, સુધારવી, ડિલીટ કરાવવી; સંમતિ પાછી ખેંચવી (ફોન સેટિંગમાં લોકેશન બંધ કરી શકો — પરંતુ કારીગરને પછી કામ ઓછું મળી શકે).</li>
<li>ખાતું ડિલીટ: એપમાં પ્રોફાઇલ → "ખાતું ડિલીટ કરો", અથવા {{email}} પર ઈમેલ.</li>
<li>ફરિયાદ: ફરિયાદ અધિકારી {{gro}}, {{groEmail}}. સંતોષ ન થાય તો ડેટા પ્રોટેક્શન બોર્ડ ઓફ ઇન્ડિયામાં જઈ શકો.</li></ul>
<h3>6. સુરક્ષા</h3>
<p>HTTPS, મર્યાદિત એડમિન પ્રવેશ અને લૉગ રાખીએ છીએ. ડેટા લીક થાય તો 72 કલાકમાં બોર્ડ અને અસરગ્રસ્ત વ્યક્તિને જાણ કરીશું.</p>
<h3>7. બાળકો</h3><p>18 વર્ષથી નાની વ્યક્તિ માટે ખાતું નથી.</p>`},

refund:{icon:'↩️', title:'રદ અને રિફંડ નીતિ', body:`
<p>છેલ્લો સુધારો: {{date}}. "થઈ જશે!" પર ચુકવણી કામ પૂરું થયા પછી સીધી કારીગરને થાય છે, એટલે એપમાં અગાઉથી પૈસા કપાતા નથી.</p>
<h3>ગ્રાહક બુકિંગ રદ કરે</h3>
<ul><li>કારીગર સ્વીકારે તે પહેલાં કે રસ્તામાં હોય ત્યાં સુધી: <b>મફત</b>.</li>
<li>કારીગર ઘરે પહોંચી જાય પછી રદ કરો: ફક્ત <b>વિઝિટ ચાર્જ</b> કારીગરને ચૂકવવાનો રહે.</li>
<li>વારંવાર છેલ્લી ઘડીએ રદ કરનાર ખાતાં પર નિયંત્રણ આવી શકે.</li></ul>
<h3>કારીગર રદ કરે / ન આવે</h3>
<ul><li>બુકિંગ આપમેળે નજીકના બીજા કારીગરોને મોકલાય છે; ગ્રાહકને કોઈ ચાર્જ નહીં.</li>
<li>કારીગર મોડો આવે કે ન આવે તો ફરિયાદ કરો — કારીગર પર કાર્યવાહી થશે.</li></ul>
<h3>વધુ પૈસા લીધા / કામ બરાબર ન થયું</h3>
<ul><li>એપના બિલથી વધુ રકમ લીધી હોય કે 7 દિવસમાં એ જ ખામી ફરી આવે તો "મદદ / ફરિયાદ" થી ટિકિટ બનાવો.</li>
<li>તપાસ પછી: કારીગર પાસેથી ફરી મફત કામ અથવા વધારાની રકમ કારીગર પાસેથી પાછી અપાવવાનો પ્રયત્ન.</li>
<li>પૈસા સીધા કારીગરને ચૂકવાય છે, એપ પાસે રહેતા નથી — તેથી રિફંડ કારીગર પાસેથી થાય છે. એપ મારફતે કોઈ રકમ પાછી આપવાની થાય તો 7 કામકાજના દિવસમાં બેંક/UPI માં.</li></ul>
{{?comm}}<h3>કારીગરનું કમીશન</h3>
<p>ભૂલથી વધુ કમીશન ચૂકવાઈ ગયું હોય તો ચુકવણીનો UTR નંબર સાથે ફરિયાદ કરો; ખરાઈ પછી આગળના કમીશનમાં સરભર અથવા પરત.</p>{{/comm}}`},

<li>એપના બિલથી વધુ પૈસા ન આપો; OTP કોઈને ફોન પર ન કહો.</li></ul>
<h3>કારીગર માટે</h3>

    // આશરે 250 KB સુધી નાનો કરો (અક્ષરો વંચાય તેટલો) — Firestore ના 1 MB દસ્તાવેજમાં 3 ફોટા સમાય
    let M = 1400, q = .72, out = ''; for(let i = 0; i < 8; i++){ const sc = Math.min(1, M / Math.max(img.width, img.height));
      const cv = document.createElement('canvas'); cv.width = Math.round(img.width * sc); cv.height = Math.round(img.height * sc); cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      out = cv.toDataURL('image/jpeg', q); if(out.length < 330000) break; if(q > .5) q -= .08; else M = Math.round(M * .8); }
    KYCF[key] = out; const pv = $('#' + key + '_pv'); if(pv) pv.innerHTML = `<img src="${KYCF[key]}" alt="" style="max-height:90px;border-radius:10px;border:1px solid var(--line)"> <span class="small" style="color:var(--ok)">✔ પસંદ કર્યો</span>`; } }

async function kycCollect(p){
  const n = ($('#' + p + '_aadn').value || '').replace(/\D/g, '');
  if(n.length !== 12) return toast('આધારના પૂરા 12 આંકડા લખો'), null;
  if(!aadhaarOk(n)) return toast('આધાર નંબર ખોટો લાગે છે — ફરી તપાસો'), null;
  if(!KYCF[p + '_aadf']) return toast('આધાર કાર્ડનો ફોટો ફરજિયાત છે'), null;
  const hash = await aadHash(n);
  if(Store.all('kyc').some(x => x.aadhaarHash === hash && (!S.session || x.id !== S.session.id))) return toast('આ આધાર નંબરથી બીજું ખાતું નોંધાયેલું છે'), null;

  ['_aadf', '_aadb', '_polf'].forEach(x => delete KYCF[p + x]);
  return {last4:n.slice(-4), masked:aadMask(n), policeNo:pno, docs:{aad:1, back:priv.aadBackPhoto ? 1 : 0, pol:priv.polPhoto ? 1 : 0}, priv, hash};
}

  <label class="f">પૂરું સરનામું<textarea id="ad_addr"></textarea></label><button class="btn ink block" onclick="addAddr()">સરનામું સેવ કરો</button></div></details></div>`; }
function weekEarn(k){ const D = 86400000, d0 = new Date(); d0.setHours(0, 0, 0, 0); const J = jobsOf(k.id).filter(b => b.status === 'done');
  const days = Array.from({length:7}, (_, i) => { const s = d0.getTime() - (6 - i) * D; const x = J.filter(b => { const t = (b.timeline || {}).done || 0; return t >= s && t < s + D; });
    return [new Date(s).toLocaleDateString(LOC(), {weekday:'short', day:'numeric'}), x.reduce((a, b) => a + (b.bill ? b.bill.gross - (b.commission || 0) : 0), 0), x.length]; });
  const mx = Math.max(1, ...days.map(d => d[1])), tot = days.reduce((a, d) => a + d[1], 0);
  return `<div class="card"><div class="between"><h3>આ અઠવાડિયાની કમાણી</h3><b class="num" style="color:var(--ok)">${rs(tot)}</b></div>${days.map(([l, v, n]) => `<div class="lbar"><span>${l}</span><span class="b"><i style="width:${v / mx * 100}%;background:var(--ok)"></i></span><b class="num">${rs(v)}</b></div>`).join('')}</div>`; }
function adminAlertBeep(){ if(!isAdmin()) return; Store.all('alerts').filter(a => a.status === 'open' && !S.seen.has(a.id)).forEach(a => { S.seen.add(a.id); beep(); toast('🆘 નવો SOS એલર્ટ: ' + a.name); }); }

<h3>3. Commission and accounts</h3><ul>{{?comm}}<li>{{comm}}% commission on the total bill of every completed job. If due commission reaches {{due}}, new jobs come only after you pay. An invoice for each commission can be downloaded in the app.</li>{{/comm}}
{{^comm}}<li><b>No commission right now.</b> The full amount the customer pays is yours. If commission is introduced later, you will be told in the app at least 30 days in advance and it applies only after you accept the new terms.</li>{{/comm}}
{{?coupon}}<li>Customer coupon discounts are borne by the app and reimbursed to you.</li>{{/coupon}}<li>Income tax/GST on your income, where applicable, is your responsibility.</li></ul>
<h3>4. Location, IP and device information</h3><p>While you are <b>online</b>, your GPS location is taken periodically to give you nearby jobs, show live tracking to the customer and prevent fraud. IP address and device details are recorded at login. When you go offline, location collection stops. Details are in the privacy policy.</p>
<h3>5. Conduct</h3><ul><li>Reach on time, never start without the OTP, always make the bill in the app.</li><li>Never charge more than the app bill. Use the customer’s number only for the job.</li>
<li>Intoxication, misbehaviour, theft or calling customers outside the app will lead to a permanent block and, if needed, a police report.</li></ul>
<h3>6. Rating</h3><p>If your average rating falls below 3.5 or you cancel often, your account may be suspended for some time after a warning.</p>
<h3>7. Closing the account</h3><p>You may delete your account anytime from Profile.{{?comm}} Any due commission remains payable.{{/comm}}</p>
<h3>8. Social security</h3><p>As per the Code on Social Security 2020, the company will help you register as a gig worker on e-Shram/government portals.</p>
<h3>9. Disputes</h3><p>Raise {{?comm}}commission or {{/comm}}customer disputes in the app. Jurisdiction: {{city}}.</p>`},
privacy:{icon:'🔒', title:'Privacy policy', body:`
<p>Last updated: {{date}}. Data Fiduciary: {{biz}}, {{addr}}. This policy follows the Digital Personal Data Protection Act 2023 and the IT Rules 2011/2021.</p>
<h3>1. What we collect</h3><ul><li><b>Customers:</b> name, Google account (or SMS OTP) login, mobile, area, addresses, bookings, problem description, ratings, in-app messages. GPS location while booking (if you allow) — to find pros within {{radius}} km and pin your address.</li>
<li><b>Pros:</b> name, mobile, photo, service, experience, area, Aadhaar (last 4 digits + secret hash only), photos of the Aadhaar card and police certificate (admins only), police verification number,{{?upi}} UPI ID,{{/upi}} earnings{{?comm}} and commission{{/comm}} records.</li>
<li><b>Notifications (push):</b> your phone’s notification token (Firebase Cloud Messaging) for new requests/bookings. For a new request the pro’s phone rings for 1 minute.</li>
<li><b>Pro location:</b> GPS location while online (about every minute, more often while travelling to a customer) and its history.</li>
<li><b>Technical data (everyone):</b> login/app-open time, IP address (recorded on our server), device/browser type, device ID (a random number created by the app), network type.</li>
<li><b>Complaints and SOS:</b> ticket details, location at the time of SOS.</li><li>We do not read your contacts, SMS or gallery.</li></ul>
<h3>2. Why</h3><ul><li>Finding a nearby pro, completing the booking, showing live tracking.</li><li>Safety of customers and pros, SOS, preventing fraud and multiple fake accounts (IP/device).</li><li>{{?comm}}Commission accounts, {{/comm}}bills, resolving complaints, legal duties (government/police requests).</li></ul>
<h3>3. Who can see it</h3><ul><li>Only after a booking is accepted do the customer and pro see each other’s number and address. While on the way, the pro’s location is visible only to that customer.</li>
<li>IP, device, login and location history and Aadhaar/police documents are visible only to authorised admins. Everyone can see only their own data (enforced by server security rules).</li><li>Data is stored on Google Firebase (Authentication, Cloud Firestore, Cloud Messaging); Cloudflare servers send notifications and record IPs. Maps are from OpenStreetMap. We do not sell data. It is shared with government agencies only on a lawful written request.</li></ul>
<h3>4. How long</h3><ul><li>Profile: while the account is active.</li><li>Login/IP logs: at least 1 year (DPDP Rules 2025) and 180 days (CERT-In).</li><li>Location and login history: 1 year, then deleted automatically. Aadhaar/police photos: while the account is active; deleted within 30 days of account deletion.</li><li>Bookings and bills: as required by law (6–8 years for GST), without your name.</li></ul>
<h3>5. Your rights</h3><ul><li>Access, correct or delete your data; withdraw consent (you can turn off location in phone settings — a pro may then get fewer jobs).</li>
<li>Delete account: in the app, Profile → “Delete account”, or email {{email}}.</li><li>Complaints: Grievance Officer {{gro}}, {{groEmail}}. If not satisfied, you may approach the Data Protection Board of India.</li></ul>
<h3>6. Security</h3><p>We use HTTPS, limited admin access and logs. In case of a data breach we will inform the Board and affected persons within 72 hours.</p>
<h3>7. Children</h3><p>Accounts are not for persons under 18.</p>`},
refund:{icon:'↩️', title:'Cancellation & refund policy', body:`
<p>Last updated: {{date}}. On “Thai Jashe!” payment is made directly to the pro after the job, so no money is taken in advance in the app.</p>
<h3>Customer cancels</h3><ul><li>Before a pro accepts, or while on the way: <b>free</b>.</li><li>After the pro reaches your home: only the <b>visit charge</b> is payable to the pro.</li><li>Accounts that repeatedly cancel at the last minute may be restricted.</li></ul>
<h3>Pro cancels / does not come</h3><ul><li>The booking is automatically sent to other nearby pros; no charge to the customer.</li><li>If a pro is late or does not come, complain — action will be taken.</li></ul>
<h3>Overcharged / work not done properly</h3><ul><li>If more than the app bill was taken, or the same fault returns within 7 days, create a ticket from “Help / complaint”.</li>
<li>After investigation: free re-work by the pro, or we try to get the extra amount refunded by the pro.</li><li>Money is paid directly to the pro and never held by the app — so refunds come from the pro. Any amount refunded through the app is credited to bank/UPI within 7 working days.</li></ul>
{{?comm}}<h3>Pro commission</h3><p>If excess commission was paid by mistake, complain with the payment UTR number; after verification it will be adjusted against future commission or refunded.</p>{{/comm}}`},
grievance:{icon:'⚖️', title:'Grievance officer', body:`
<p>As per the IT (Intermediary Guidelines) Rules 2021, Consumer Protection (E-Commerce) Rules 2020 and the DPDP Act 2023:</p>
<ul><li><b>Grievance Officer:</b> {{gro}}</li><li><b>Email:</b> {{groEmail}}</li><li><b>Phone:</b> {{phone}}</li><li><b>Address:</b> {{addr}}</li><li><b>Hours:</b> {{hours}}</li></ul>
<h3>How to complain</h3><ol><li>In the app: “Help / complaint” → New complaint. You will get a ticket number (TJ-…).</li><li>Or email the name, mobile, booking number and details to the address above.</li></ol>
<h3>Timelines</h3><ul><li>Acknowledgement: within <b>24 hours</b>.</li><li>Resolution: within <b>15 days</b>.</li><li>Objectionable/private images: removed within 24 hours.</li></ul>
<p>If not satisfied: National Consumer Helpline 1915 / consumerhelpline.gov.in, or the Grievance Appellate Committee (gac.gov.in).</p>`},
safety:{icon:'🛡️', title:'Safety', body:`
<h3>For customers</h3><ul><li>Every pro’s photo, identity and police verification are checked. Look for the “Police verified” badge.</li><li>Check that the person matches the photo in the app before giving the OTP.</li>
<li>Use <b>“Share”</b> in an ongoing booking to send the pro’s details to a family member.</li><li>If you feel unsafe, tap <b>🆘 SOS</b> — it calls 112 and sends your location to the admin immediately.</li>
<li>Never pay more than the app bill; never tell the OTP on the phone.</li></ul>
<h3>For pros</h3><ul><li>The customer’s rating is shown in the booking. If a customer misbehaves, rate them and complain.</li><li>If you feel unsafe, tap 🆘 SOS on the job screen.</li></ul>
<h3>Emergency numbers</h3><p>Police/ambulance/fire: <b>112</b> • Women (Abhayam): <b>181</b> • Cyber fraud: <b>1930</b></p>`},
delete:{icon:'🗑️', title:'How to delete your account', body:`
<ol><li>Log in to the app → “Profile” at the bottom.</li><li>“Delete account” → “Yes, delete”.</li></ol>
<p>Or email {{email}} with your registered mobile number; it will be deleted within 7 days.</p>
<h3>What is erased</h3><p>Name, mobile, addresses, photo, location history, messages.</p>
<h3>What is kept</h3><p>Booking/bill records required by law, without your name, and security logs (IP) for up to 1 year.</p>`}

<h3>हमारी शुरुआत</h3>
<p>यह ऐप एक एसी रिपेयर कारीगर ने शुरू किया है। कारीगर को रोज़ अच्छा काम चाहिए और ग्राहक को भरोसेमंद आदमी। इन दोनों को जोड़ने के लिए "थई जशे!" बना है। हमारा नारा: <b>काम है? थई जशे! (हो जाएगा!)</b></p>
<h3>हम क्या अलग करते हैं</h3>
<ul><li><b>कारीगर को पूरा हक़:</b> ग्राहक कारीगर को सीधे ({{pay}}) भुगतान करता है। {{?comm}}ऐप सिर्फ़ पूरे हुए काम पर {{comm}}% कमीशन लेता है।{{/comm}}{{^comm}}अभी ऐप कारीगर से कोई कमीशन नहीं लेता — पूरी रकम कारीगर की।{{/comm}}</li>
<li><b>जाँचे हुए कारीगर:</b> पहचान, फ़ोटो और पुलिस वेरिफ़िकेशन के बाद ही मंज़ूरी।</li>
<li><b>OTP से सुरक्षित शुरुआत:</b> ग्राहक OTP दे उसके बाद ही काम शुरू। लॉगिन Google खाते से (मुफ़्त, बिना पासवर्ड)।</li>
<li><b>गुजराती, हिन्दी और अंग्रेज़ी:</b> जो भाषा पसंद हो उसमें ऐप चलाएँ।</li></ul>
<h3>कंपनी का विवरण</h3>
<p>संचालक: {{biz}}<br>पता: {{addr}}<br>GSTIN: {{gst}}<br>ईमेल: {{email}} • फ़ोन: {{phone}}</p>`},
contact:{icon:'📞', title:'संपर्क करें', body:`
<p>किसी भी सवाल, मदद या शिकायत के लिए हमसे संपर्क करें। चालू बुकिंग में समस्या हो तो बुकिंग के अंदर "मदद / शिकायत" दबाएँ — सबसे जल्दी जवाब वहीं मिलता है।</p>
<ul><li><b>हेल्पलाइन:</b> {{phone}} ({{hours}})</li><li><b>WhatsApp:</b> {{wa}}</li><li><b>ईमेल:</b> {{email}}</li><li><b>ऑफ़िस का पता:</b> {{addr}}</li></ul>
<h3>शिकायत अधिकारी</h3><p>{{gro}} • ईमेल: {{groEmail}}<br>24 घंटे में पावती, 15 दिन में निपटारा।</p>
<h3>आपातकाल</h3><p>जान या सुरक्षा का खतरा हो तो तुरंत <b>112</b> पर कॉल करें। महिला हेल्पलाइन (अभयम): <b>181</b> • साइबर धोखाधड़ी: <b>1930</b> • उपभोक्ता हेल्पलाइन: <b>1915</b></p>`},
terms:{icon:'📜', title:'उपयोग की शर्तें (ग्राहक)', body:`
<p>आख़िरी बदलाव: {{date}}। "थई जशे!" ऐप/वेबसाइट ({{biz}} द्वारा संचालित) इस्तेमाल करके आप ये शर्तें स्वीकार करते हैं।</p>
<h3>1. हमारी भूमिका</h3><p>थई जशे! एक ऑनलाइन मार्केटप्लेस है जो ग्राहकों को स्वतंत्र कारीगरों से जोड़ता है। काम कारीगर करता है, जो कंपनी का कर्मचारी नहीं है। काम की गुणवत्ता की शिकायत हो तो आपके और कारीगर के बीच हल कराने में हम पूरी मदद करते हैं।</p>
<h3>2. खाता</h3><ul><li>सही नाम, मोबाइल नंबर और पता देना ज़रूरी है। 18 साल से कम उम्र के लोग सिर्फ़ अभिभावक की निगरानी में बुक कर सकते हैं।</li><li>आपके खाते से हुई बुकिंग की ज़िम्मेदारी आपकी है।</li></ul>
<h3>3. बुकिंग और कीमत</h3><ul><li>दिखाया गया विज़िट चार्ज और रेट कार्ड अनुमानित है। काम देखकर कारीगर ऐप में अंतिम बिल बनाता है; बिल आने से पहले आप रकम पूछ सकते हैं।</li>
<li>काम न करवाएँ तो सिर्फ़ विज़िट चार्ज देना होगा।</li><li>काम के बाद भुगतान सीधे कारीगर को ({{pay}}) होता है। {{^upi}}अभी सिर्फ़ नकद भुगतान चालू है; ऑनलाइन/UPI भुगतान शुरू होगा तब बताएँगे।{{/upi}} ऐप आपके पैसे अपने पास नहीं रखता। ऐप में दिखी रकम से ज़्यादा न दें।</li>
{{?coupon}}<li>कूपन की छूट ऐप उठाता है; एक बुकिंग पर एक ही कूपन।</li>{{/coupon}}</ul>
<h3>4. OTP और सुरक्षा</h3><p>कारीगर घर पहुँचे तभी OTP दें। OTP फ़ोन पर या मैसेज में किसी को न भेजें।</p>
<h3>5. रद्दीकरण</h3><p><b>रद्दीकरण और रिफ़ंड नीति</b> के अनुसार।</p>
<h3>6. मना है</h3><ul><li>झूठी बुकिंग, कारीगर से दुर्व्यवहार, धमकी या भेदभाव।</li><li>गैरकानूनी काम के लिए बुकिंग।</li><li>ऐप के बाहर सौदा करने के लिए कारीगर पर दबाव, या किसी दूसरे के नाम/नंबर से खाता।</li></ul><p>ऐसे खाते बंद किए जा सकते हैं।</p>
<h3>7. रेटिंग और रिव्यू</h3><p>रिव्यू ईमानदार और अपने अनुभव पर आधारित होने चाहिए। अपमानजनक या झूठे रिव्यू हटाए जा सकते हैं। कारीगर भी ग्राहक को रेटिंग देते हैं।</p>
<h3>8. ज़िम्मेदारी की सीमा</h3><p>कारीगर के काम से हुए नुकसान की शिकायत 7 दिन में करें; हम जाँच करके कारीगर से फिर काम या मुआवज़ा दिलाने की कोशिश करेंगे। कानून की अनुमति तक कंपनी की ज़िम्मेदारी उस बुकिंग की बिल रकम तक सीमित है।</p>
<h3>9. कानून और अधिकार क्षेत्र</h3><p>ये शर्तें भारत के कानूनों (IT Act 2000 और उपभोक्ता संरक्षण (ई-कॉमर्स) नियम 2020 सहित) के अधीन हैं। {{city}} की अदालतों को अधिकार क्षेत्र है। उपभोक्ता आयोग में जाने का आपका अधिकार बना रहता है।</p>
<h3>10. संपर्क</h3><p>{{email}} • {{phone}}</p>`},
kterms:{icon:'🧰', title:'कारीगर पार्टनर शर्तें', body:`
<p>आख़िरी बदलाव: {{date}}। "थई जशे!" पर कारीगर के रूप में पंजीकरण करके आप ये शर्तें स्वीकार करते हैं।</p>
<h3>1. स्वतंत्र पार्टनर</h3><p>आप स्वतंत्र सेवा प्रदाता (गिग वर्कर) हैं, कर्मचारी नहीं। कब ऑनलाइन होना है और कौन सा काम लेना है, यह आप तय करते हैं।</p>
<h3>2. पंजीकरण और जाँच (KYC)</h3><ul><li>सही नाम, Google खाता (या SMS OTP) से लॉगिन, मोबाइल, फ़ोटो, <b>आधार नंबर और आधार कार्ड का फ़ोटो अनिवार्य</b>।</li>
<li>आधार नंबर सिर्फ़ सही है यह जाँचने के लिए लिया जाता है; ऐप में सिर्फ़ "XXXX XXXX आख़िरी 4" और गुप्त hash रखा जाता है — पूरा नंबर संग्रहित नहीं होता (UIDAI मार्गदर्शन)।</li>
<li>आधार कार्ड और पुलिस वेरिफ़िकेशन सर्टिफ़िकेट के फ़ोटो सुरक्षित सर्वर (Google Firebase) पर रखे जाते हैं और <b>सिर्फ़ एडमिन</b> देख सकता है; ग्राहक को कभी नहीं दिखते।</li>
<li>पुलिस वेरिफ़िकेशन सर्टिफ़िकेट देना ज़रूरी है; तब तक प्रोफ़ाइल "मंज़ूरी बाकी" रह सकती है। एडमिन मूल दस्तावेज़ देखकर मंज़ूरी देता है।</li></ul>
<h3>3. कमीशन और हिसाब</h3><ul>{{?comm}}<li>हर पूरे हुए काम के कुल बिल पर {{comm}}% कमीशन। बाकी कमीशन {{due}} होने पर चुकाने के बाद ही नया काम मिलेगा। हर कमीशन का इनवॉइस ऐप से डाउनलोड हो सकता है।</li>{{/comm}}
{{^comm}}<li><b>अभी कोई कमीशन नहीं।</b> ग्राहक जो चुकाए वह पूरी रकम आपकी। भविष्य में कमीशन शुरू हुआ तो कम से कम 30 दिन पहले ऐप में बताया जाएगा और नई शर्तें स्वीकारने के बाद ही लागू होगा।</li>{{/comm}}
{{?coupon}}<li>ग्राहक के कूपन की छूट ऐप उठाता है और आपको वापस दी जाती है।</li>{{/coupon}}<li>आपकी आय पर आयकर/GST की ज़िम्मेदारी, जहाँ लागू हो, आपकी है।</li></ul>
<h3>4. लोकेशन, IP और डिवाइस जानकारी</h3><p>आप <b>ऑनलाइन</b> हों तब नज़दीकी काम देने, ग्राहक को लाइव ट्रैकिंग दिखाने और धोखाधड़ी रोकने के लिए समय-समय पर आपकी GPS लोकेशन ली जाती है। लॉगिन के समय IP पता और डिवाइस विवरण दर्ज होता है। ऑफ़लाइन होने पर लोकेशन लेना बंद हो जाता है। विवरण प्राइवेसी पॉलिसी में है।</p>
<h3>5. व्यवहार</h3><ul><li>समय पर पहुँचना, OTP के बिना काम शुरू न करना, बिल हमेशा ऐप में बनाना।</li><li>ऐप के बिल से ज़्यादा पैसे न लेना। ग्राहक का नंबर सिर्फ़ काम के लिए इस्तेमाल करना।</li>
<li>नशा, दुर्व्यवहार, चोरी या ग्राहक को ऐप के बाहर बुलाने पर खाता हमेशा के लिए बंद और ज़रूरत हो तो पुलिस शिकायत।</li></ul>
<h3>6. रेटिंग</h3><p>औसत रेटिंग 3.5 से कम हो या आप बार-बार रद्द करें तो चेतावनी के बाद खाता कुछ समय के लिए रोका जा सकता है।</p>
<h3>7. खाता बंद करना</h3><p>आप कभी भी प्रोफ़ाइल से खाता डिलीट कर सकते हैं।{{?comm}} बाकी कमीशन चुकाने की ज़िम्मेदारी बनी रहती है।{{/comm}}</p>
<h3>8. सामाजिक सुरक्षा</h3><p>सामाजिक सुरक्षा संहिता 2020 के अनुसार, ई-श्रम/सरकारी पोर्टल पर गिग वर्कर के रूप में पंजीकरण में कंपनी आपकी मदद करेगी।</p>
<h3>9. विवाद</h3><p>{{?comm}}कमीशन या {{/comm}}ग्राहक से जुड़े विवाद के लिए ऐप में शिकायत करें। अधिकार क्षेत्र: {{city}}।</p>`},
privacy:{icon:'🔒', title:'प्राइवेसी पॉलिसी', body:`
<p>आख़िरी बदलाव: {{date}}। डेटा फ़िड्यूशियरी: {{biz}}, {{addr}}। यह नीति डिजिटल पर्सनल डेटा प्रोटेक्शन अधिनियम 2023 और IT नियम 2011/2021 के अनुसार है।</p>
<h3>1. हम क्या लेते हैं</h3><ul><li><b>ग्राहक:</b> नाम, Google खाता (या SMS OTP) से लॉगिन, मोबाइल, इलाका, पते, बुकिंग, तकलीफ़ का विवरण, रेटिंग, ऐप के संदेश। बुकिंग के समय GPS लोकेशन (आप अनुमति दें तो) — {{radius}} किमी के अंदर के कारीगर खोजने और पता सटीक करने के लिए।</li>
<li><b>कारीगर:</b> नाम, मोबाइल, फ़ोटो, काम, अनुभव, इलाका, आधार (सिर्फ़ आख़िरी 4 अंक + गुप्त hash), आधार कार्ड और पुलिस सर्टिफ़िकेट के फ़ोटो (सिर्फ़ एडमिन के लिए), पुलिस वेरिफ़िकेशन नंबर,{{?upi}} UPI ID,{{/upi}} कमाई{{?comm}} और कमीशन{{/comm}} का हिसाब।</li>
<li><b>सूचनाएँ (Push):</b> नए अनुरोध/बुकिंग की सूचना के लिए फ़ोन का सूचना टोकन (Firebase Cloud Messaging)। नए अनुरोध पर कारीगर के फ़ोन में 1 मिनट रिंग बजती है।</li>
<li><b>कारीगर की लोकेशन:</b> ऑनलाइन होने पर GPS लोकेशन (लगभग हर मिनट, ग्राहक की ओर जाते समय ज़्यादा बार) और उसका इतिहास।</li>
<li><b>तकनीकी जानकारी (सबके लिए):</b> लॉगिन/ऐप खोलने का समय, IP पता (हमारे सर्वर पर दर्ज), डिवाइस/ब्राउज़र का प्रकार, डिवाइस ID (ऐप द्वारा बनाया गया रैंडम नंबर), नेटवर्क का प्रकार।</li>
<li><b>शिकायत और SOS:</b> टिकट का विवरण, SOS के समय की लोकेशन।</li><li>हम आपके कॉन्टैक्ट, SMS या गैलरी नहीं पढ़ते।</li></ul>
<h3>2. क्यों</h3><ul><li>नज़दीकी कारीगर खोजना, बुकिंग पूरी करना, लाइव ट्रैकिंग दिखाना।</li><li>ग्राहक और कारीगर की सुरक्षा, SOS, धोखाधड़ी और एक से ज़्यादा झूठे खाते रोकना (IP/डिवाइस)।</li><li>{{?comm}}कमीशन का हिसाब, {{/comm}}बिल, शिकायत का निपटारा, कानूनी दायित्व (सरकारी/पुलिस माँग)।</li></ul>
<h3>3. कौन देख सकता है</h3><ul><li>बुकिंग स्वीकार होने के बाद ही ग्राहक और कारीगर को एक-दूसरे का नंबर और पता दिखता है। रास्ते में होने पर कारीगर की लोकेशन सिर्फ़ उसी ग्राहक को दिखती है।</li>
<li>IP, डिवाइस, लॉगिन और लोकेशन इतिहास तथा आधार/पुलिस दस्तावेज़ सिर्फ़ अधिकृत एडमिन को दिखते हैं। हर व्यक्ति सिर्फ़ अपना डेटा देख सकता है (सर्वर सुरक्षा नियमों से)।</li><li>डेटा Google Firebase (Authentication, Cloud Firestore, Cloud Messaging) सर्वर पर रखा जाता है; सूचना और IP दर्ज करने के लिए Cloudflare सर्वर इस्तेमाल होता है। नक्शा OpenStreetMap का है। हम डेटा नहीं बेचते। कानूनी लिखित माँग पर ही सरकारी एजेंसी को देते हैं।</li></ul>
<h3>4. कितने समय तक</h3><ul><li>प्रोफ़ाइल: खाता चालू रहने तक।</li><li>लॉगिन/IP लॉग: कम से कम 1 साल (DPDP नियम 2025) और 180 दिन (CERT-In)।</li><li>लोकेशन और लॉगिन इतिहास: 1 साल, फिर अपने-आप मिट जाता है। आधार/पुलिस फ़ोटो: खाता चालू रहने तक; खाता डिलीट होने पर 30 दिन में मिटा दिए जाते हैं।</li><li>बुकिंग और बिल: कानून के अनुसार (GST के लिए 6–8 साल) बिना नाम के।</li></ul>
<h3>5. आपके अधिकार</h3><ul><li>अपनी जानकारी देखना, सुधारना, डिलीट करवाना; सहमति वापस लेना (फ़ोन सेटिंग में लोकेशन बंद कर सकते हैं — पर तब कारीगर को काम कम मिल सकता है)।</li>
<li>खाता डिलीट: ऐप में प्रोफ़ाइल → "खाता डिलीट करें", या {{email}} पर ईमेल करें।</li><li>शिकायत: शिकायत अधिकारी {{gro}}, {{groEmail}}। संतुष्ट न हों तो डेटा प्रोटेक्शन बोर्ड ऑफ़ इंडिया में जा सकते हैं।</li></ul>
<h3>6. सुरक्षा</h3><p>हम HTTPS, सीमित एडमिन पहुँच और लॉग का इस्तेमाल करते हैं। डेटा लीक होने पर 72 घंटे में बोर्ड और प्रभावित लोगों को सूचित करेंगे।</p>
<h3>7. बच्चे</h3><p>18 साल से कम उम्र के लोगों के लिए खाता नहीं है।</p>`},
refund:{icon:'↩️', title:'रद्दीकरण और रिफ़ंड नीति', body:`
<p>आख़िरी बदलाव: {{date}}। "थई जशे!" पर भुगतान काम पूरा होने के बाद सीधे कारीगर को होता है, इसलिए ऐप में पहले से पैसे नहीं कटते।</p>
<h3>ग्राहक रद्द करे</h3><ul><li>कारीगर के स्वीकारने से पहले, या रास्ते में हो तब: <b>मुफ़्त</b>।</li><li>कारीगर घर पहुँच जाए उसके बाद: कारीगर को सिर्फ़ <b>विज़िट चार्ज</b> देना होगा।</li><li>बार-बार आख़िरी समय पर रद्द करने वाले खाते पर रोक लग सकती है।</li></ul>
<h3>कारीगर रद्द करे / न आए</h3><ul><li>बुकिंग अपने-आप दूसरे नज़दीकी कारीगरों को चली जाती है; ग्राहक से कोई चार्ज नहीं।</li><li>कारीगर देर से आए या न आए तो शिकायत करें — कारीगर पर कार्रवाई होगी।</li></ul>
<h3>ज़्यादा पैसे लिए / काम ठीक नहीं हुआ</h3><ul><li>ऐप के बिल से ज़्यादा पैसे लिए हों, या 7 दिन में वही खराबी फिर आए तो "मदद / शिकायत" से टिकट बनाएँ।</li>
<li>जाँच के बाद: कारीगर से फिर मुफ़्त काम, या ज़्यादा ली गई रकम कारीगर से वापस दिलाने की कोशिश।</li><li>पैसे सीधे कारीगर को दिए जाते हैं, ऐप के पास नहीं रहते — इसलिए रिफ़ंड कारीगर से होता है। ऐप के ज़रिए कोई रकम वापस देनी हो तो 7 कार्य-दिवस में बैंक/UPI में।</li></ul>
{{?comm}}<h3>कारीगर का कमीशन</h3><p>गलती से ज़्यादा कमीशन चुका दिया हो तो भुगतान के UTR नंबर के साथ शिकायत करें; जाँच के बाद आगे के कमीशन में समायोजित या वापस।</p>{{/comm}}`},

<h3>समय-सीमा</h3><ul><li>पावती: <b>24 घंटे</b> में।</li><li>निपटारा: <b>15 दिन</b> में।</li><li>आपत्तिजनक/निजी तस्वीरें: 24 घंटे में हटाई जाएँगी।</li></ul>
<p>संतुष्ट न हों तो: राष्ट्रीय उपभोक्ता हेल्पलाइन 1915 / consumerhelpline.gov.in, या शिकायत अपील समिति (gac.gov.in)।</p>`},
safety:{icon:'🛡️', title:'सुरक्षा', body:`
<h3>ग्राहकों के लिए</h3><ul><li>हर कारीगर का फ़ोटो, पहचान और पुलिस वेरिफ़िकेशन जाँचा जाता है। "पुलिस वेरिफ़ाइड" बैज देखें।</li><li>OTP देने से पहले जाँचें कि आया व्यक्ति ऐप के फ़ोटो जैसा ही है।</li>
<li>चालू बुकिंग में <b>"शेयर"</b> से कारीगर का विवरण परिवार के सदस्य को भेजें।</li><li>असुरक्षित लगे तो <b>🆘 SOS</b> दबाएँ — 112 पर कॉल होगी और आपकी लोकेशन तुरंत एडमिन को पहुँचेगी।</li>
<li>ऐप के बिल से ज़्यादा पैसे न दें; OTP किसी को फ़ोन पर न बताएँ।</li></ul>
<h3>कारीगरों के लिए</h3><ul><li>बुकिंग में ग्राहक की रेटिंग दिखती है। ग्राहक दुर्व्यवहार करे तो रेटिंग दें और शिकायत करें।</li><li>असुरक्षित लगे तो काम की स्क्रीन पर 🆘 SOS दबाएँ।</li></ul>
<h3>आपातकालीन नंबर</h3><p>पुलिस/एम्बुलेंस/फ़ायर: <b>112</b> • महिला (अभयम): <b>181</b> • साइबर धोखाधड़ी: <b>1930</b></p>`},

let DLP = null;
try{ if(window.claude && typeof window.claude.use === 'function') DLP = window.claude.use('downloads').catch(() => null); }catch(e){ DLP = null; }
const blobB64 = b => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1]); r.onerror = no; r.readAsDataURL(b); });
async function saveBlob(name, blob){
  if(DLP){ const d = await DLP; if(d){ try{ await d.save({filename:name, data:blob}); toast(L2('ફાઇલ સેવ થઈ: ', 'File saved: ') + name); return true; }
    catch(e){ const c = e && e.code; if(c === 'declined'){ toast(L2('ડાઉનલોડ રદ કર્યું', 'Download cancelled')); return true; }
      if(c === 'rate_limited'){ toast(L2('થોડી વાર પછી ફરી પ્રયત્ન કરો', 'Please try again in a moment')); return true; }
      if(c === 'too_large'){ toast(L2('ફાઇલ બહુ મોટી છે', 'File is too large')); return true; } } } }
  const P = window.Capacitor && window.Capacitor.Plugins;
  if(P && P.Filesystem && P.Share){ try{ const data = await blobB64(blob); const r = await P.Filesystem.writeFile({path:name, data, directory:'CACHE'});
      try{ await P.Share.share({title:name, files:[r.uri]}); }catch(e){ if(!/cancel/i.test(String(e && e.message))) await P.Share.share({title:name, url:r.uri}); } return true; }
    catch(e){ console.error(e); } }
  try{ const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000); toast(L2('ફાઇલ સેવ થઈ: ', 'File saved: ') + name); return true; }catch(e){ return false; }
}

/* ---------- demo robots: sample karigars act on their own (local demo only) ---------- */
function botTick(){
  if(APP_MODE === 'admin') return;
  if(Store.mode !== 'local' || !Store.ready) return;
  const now = Date.now(); const sid = S.session && S.session.id;
  for(const b of Store.all('bookings')){
    const t = (b.timeline || {})[b.status] || b.createdAt, age = now - t;
    if(b.status === 'searching' && age > 5000){
      const c = Store.all('karigars').filter(k => k.bot && k.online && k.status === 'approved' && catMatch(k.cat, b.cat) && k.id !== sid && !activeJobOf(k.id) && !(b.rejectedBy || []).includes(k.id) && inRadius(k, b))
        .sort((x, y) => distKm(b.area, x.area) - distKm(b.area, y.area));
      if(c.length) Store.claim(b.id, c[0].id); continue;
    }
    const k = b.karigarId && Store.get('karigars', b.karigarId); if(!k || !k.bot || k.id === sid) continue;
    if(b.status === 'requested' && age > 4000) setStatus(b, 'accepted');
    else if(b.status === 'accepted' && age > 5000) setStatus(b, 'onway');
    else if(b.status === 'onway' && age > 12000){ setStatus(b, 'arrived'); }
    else if(b.status === 'onway'){ const A = areaLL(k.area, k.areaGeo), Bp = b.geo || areaLL(b.area, b.areaGeo); if(A && Bp){ const f = Math.min(1, age / 12000);
      Store.patch('karigars', k.id, {loc:{lat:+(A.lat + (Bp.lat - A.lat) * f).toFixed(6), lng:+(A.lng + (Bp.lng - A.lng) * f).toFixed(6), acc:8, ts:now}, lastSeen:now}); } }
    else if(b.status === 'done' && !b.kRating && age > 3000){ const c = Store.get('customers', b.custId); Store.patch('bookings', b.id, {kRating:5, kReview:'સારા ગ્રાહક'});
      if(c) Store.patch('customers', c.id, {ratingSum:(c.ratingSum || 0) + 5, ratingCount:(c.ratingCount || 0) + 1}); }
    else if(b.status === 'arrived' && age > 8000) setStatus(b, 'working');
    else if(b.status === 'working' && age > 10000){ const labour = k.visit + 50 * (3 + Math.floor(Math.random() * 6)), parts = Math.random() < .5 ? 0 : 150;
      const gross = labour + parts, discount = Math.min(gross, b.coupon ? b.coupon.amount : 0);
      setStatus(b, 'billed', {bill:{labour, parts, note:'સર્વિસ પૂરી, બધું ચેક કર્યું', gross, discount, payable:gross - discount}}); }
    else if(b.status === 'billed' && b.custPaid && now - b.custPaid > 2500) finishJob(b);
  }
}
