# થઈ જશે! — Firebase માં Firestore સુરક્ષા નિયમો અને indexes મૂકે છે (મફત Spark પ્લાનમાં ચાલે).
# (વૈકલ્પિક — એ જ નિયમો Firebase Console → Firestore → Rules માં હાથે પેસ્ટ કરી શકાય.)
# જરૂરી: Settings → Secrets → FIREBASE_SERVICE_ACCOUNT (service account ની JSON કી)
#        Settings → Variables → FIREBASE_PROJECT_ID (દા.ત. karigar-da1f6)
name: Firebase deploy (નિયમો)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'firebase.json'
      - '.github/workflows/firebase-deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Firebase માં મૂકો
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PROJECT: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          if [ -z "$SA" ] || [ -z "$PROJECT" ]; then echo "❌ FIREBASE_SERVICE_ACCOUNT secret અને FIREBASE_PROJECT_ID variable ઉમેરો"; exit 1; fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx -y firebase-tools@15 deploy --only firestore --project "$PROJECT" --non-interactive --force
          rm -f "$RUNNER_TEMP/sa.json"
